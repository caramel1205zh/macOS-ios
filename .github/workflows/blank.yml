name: Generate macOS Tahoe ISO

on:
  workflow_dispatch:

run-name: Generate macOS Tahoe v26.6.1 ISO

env:
  installer_version: "26.6.1"
  installer_name: "Tahoe"

jobs:
  build:
    runs-on: macos-26
    steps:
      # Download Installer
      - name: Download macOS Installer
        run: |
          # 1. 在可写的数据目录创建 BetaProgram.plist 并写入配置
          sudo mkdir -p /System/Volumes/Data/private/tmp/beta_config
          sudo defaults write /System/Volumes/Data/private/tmp/beta_config/BetaProgram.plist ProgramName -string "PublicSeed"
          
          # 2. 创建软链接，让系统能从只读的系统目录中读取到配置文件
          sudo ln -sf /System/Volumes/Data/private/tmp/beta_config/BetaProgram.plist /System/Library/PrivateFrameworks/Seeding.framework/Versions/A/Resources/BetaProgram.plist
          
          # 3. 列出并下载指定版本的完整安装包
          softwareupdate --list-full-installers
          softwareupdate --fetch-full-installer --full-installer-version ${{ env.installer_version }}

      # Generate ISO Installer
      - name: Generate macOS ISO Installer
        run: |
          sudo hdiutil create -o /tmp/'${{ env.installer_name }}' -size 16800m -volname '${{ env.installer_name }}' -layout SPUD -fs HFS+J
          sudo hdiutil attach /tmp/'${{ env.installer_name }}'.dmg -noverify -mountpoint /Volumes/'${{ env.installer_name }}'
          sleep 20
          sudo /Applications/'Install macOS ${{ env.installer_name }}'.app/Contents/Resources/createinstallmedia --volume /Volumes/'${{ env.installer_name }}' --nointeraction
          echo "Sleeping 100 to allow the installer to finish"
          sleep 100
          hdiutil eject -force /Volumes/'Install macOS ${{ env.installer_name }}'
          hdiutil convert /tmp/'${{ env.installer_name }}'.dmg -format UDTO -o ~/Desktop/'${{ env.installer_name }}'
          mv -v ~/Desktop/'${{ env.installer_name }}'.cdr ~/Desktop/'${{ env.installer_name }}'.iso
          sudo rm -fv /tmp/'${{ env.installer_name }}'.dmg

      # Upload ISO
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: macOS ${{ env.installer_name }} ${{ env.installer_version }} ISO
          path: ~/Desktop/${{ env.installer_name }}.iso
